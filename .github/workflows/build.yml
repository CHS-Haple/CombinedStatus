name: Build

on:
  push:
    branches: [ main, dev, validation/dev ]
  pull_request:
    branches: [ main, dev ]
    types: [ opened, synchronize, reopened, ready_for_review, converted_to_draft ]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  packages: read
  statuses: write

concurrency:
  group: build-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MIUIX_GITHUB_ACTOR: ${{ github.repository_owner }}
      MIUIX_GITHUB_TOKEN: ${{ secrets.MIUIX_GITHUB_TOKEN }}
      GITHUB_ACTOR: ${{ github.actor }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Classify validation scope
        id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_DRAFT: ${{ github.event.pull_request.draft || false }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref || '' }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || '' }}
        run: |
          FULL_BUILD=true
          REASON="trusted branch or manual build"

          if [[ "$EVENT_NAME" == "push" && "$GITHUB_REF" == "refs/heads/validation/dev" ]]; then
            FULL_BUILD=false
            REASON="device-validation marker update"
          elif [[ "$EVENT_NAME" == "pull_request" ]]; then
            FULL_BUILD=false
            REASON="lightweight pull-request validation"

            if [[ "$PR_DRAFT" == "true" ]]; then
              REASON="draft pull request"
            elif [[ "$PR_BASE_REF" == "main" ]]; then
              FULL_BUILD=true
              REASON="ready pull request targeting main"
            else
              mapfile -t CHANGED_FILES < <(git diff --name-only "$PR_BASE_SHA" "$PR_HEAD_SHA")
              for path in "${CHANGED_FILES[@]}"; do
                case "$path" in
                  app/*|compat/*|gradle/*|tools/*|.github/workflows/*|build.gradle.kts|settings.gradle.kts|gradle.properties|gradlew|gradlew.bat)
                    FULL_BUILD=true
                    REASON="APK/build/compatibility/CI-affecting path changed: $path"
                    break
                    ;;
                esac
              done
            fi
          fi

          echo "full_build=$FULL_BUILD" >> "$GITHUB_OUTPUT"
          echo "Validation scope: full_build=$FULL_BUILD ($REASON)"

      - name: Lightweight repository checks
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git diff --check "$PR_BASE_SHA" "$PR_HEAD_SHA"

      - name: Validate Gradle Wrapper
        if: steps.scope.outputs.full_build == 'true'
        uses: gradle/actions/wrapper-validation@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3

      - name: Set up Java
        if: steps.scope.outputs.full_build == 'true'
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android API 37
        if: steps.scope.outputs.full_build == 'true'
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --channel=3 "platforms;android-37.0" "build-tools;37.0.0"

      - name: Set up Gradle
        if: steps.scope.outputs.full_build == 'true'
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3

      - name: Restore and verify Haple signing
        if: steps.scope.outputs.full_build == 'true' && github.event_name != 'pull_request'
        shell: bash
        env:
          HAPLE_KEYSTORE_BASE64: ${{ secrets.HAPLE_KEYSTORE_BASE64 }}
          HAPLE_KEYSTORE_PASSWORD: ${{ secrets.HAPLE_KEYSTORE_PASSWORD }}
          HAPLE_KEY_ALIAS: ${{ secrets.HAPLE_KEY_ALIAS }}
          HAPLE_CERT_SHA256: 7a64fc85325afe79439afb63369d832d7ddc20fd5b3935b4c28d7bcb85e92fc7
        run: bash tools/setup_haple_signing.sh

      - name: Verify pinned HyperOS target profile
        if: steps.scope.outputs.full_build == 'true'
        run: python3 tools/verify_target_profile.py

      - name: Run unit tests
        if: steps.scope.outputs.full_build == 'true'
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Build debug and canary APKs
        if: steps.scope.outputs.full_build == 'true'
        env:
          HAPLE_KEYSTORE_PASSWORD: ${{ github.event_name != 'pull_request' && secrets.HAPLE_KEYSTORE_PASSWORD || '' }}
          HAPLE_KEY_ALIAS: ${{ github.event_name != 'pull_request' && secrets.HAPLE_KEY_ALIAS || '' }}
        run: ./gradlew :app:assembleDebug :app:assembleCanary --stacktrace

      - name: Resolve built APK paths
        if: steps.scope.outputs.full_build == 'true'
        shell: bash
        run: |
          DEBUG_APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          if [[ -f "app/build/outputs/apk/canary/app-canary.apk" ]]; then
            CANARY_APK_PATH="app/build/outputs/apk/canary/app-canary.apk"
          elif [[ -f "app/build/outputs/apk/canary/app-canary-unsigned.apk" ]]; then
            CANARY_APK_PATH="app/build/outputs/apk/canary/app-canary-unsigned.apk"
          else
            echo "Canary APK output was not found."
            exit 1
          fi
          echo "DEBUG_APK_PATH=$DEBUG_APK_PATH" >> "$GITHUB_ENV"
          echo "CANARY_APK_PATH=$CANARY_APK_PATH" >> "$GITHUB_ENV"

      - name: Verify modern Xposed metadata
        if: steps.scope.outputs.full_build == 'true'
        shell: bash
        run: |
          REQUIRED_ENTRIES=(
            "META-INF/xposed/java_init.list"
            "META-INF/xposed/module.prop"
            "META-INF/xposed/scope.list"
          )

          for APK in "$DEBUG_APK_PATH" "$CANARY_APK_PATH"; do
            for entry in "${REQUIRED_ENTRIES[@]}"; do
              if ! unzip -Z1 "$APK" | grep -Fxq "$entry"; then
                echo "Missing modern Xposed metadata in $APK: $entry"
                exit 1
              fi
            done

            if unzip -Z1 "$APK" | grep -Fxq "assets/xposed_init"; then
              echo "Legacy Xposed entry metadata must not be packaged in $APK."
              exit 1
            fi

            if [[ "$(unzip -p "$APK" META-INF/xposed/scope.list | tr -d '\r\n')" != "com.android.systemui" ]]; then
              echo "Unexpected Xposed scope in $APK."
              exit 1
            fi

            if ! unzip -p "$APK" META-INF/xposed/module.prop | grep -Fxq "targetApiVersion=102"; then
              echo "Modern Xposed target API 102 metadata is missing from $APK."
              exit 1
            fi

            if ! unzip -p "$APK" META-INF/xposed/module.prop | grep -Fxq "autoHotReload=true"; then
              echo "Modern Xposed hot reload metadata is missing from $APK."
              exit 1
            fi

            JAVA_ENTRY_COUNT="$(
              unzip -p "$APK" META-INF/xposed/java_init.list |
                tr -d '\r' |
                sed '/^[[:space:]]*$/d' |
                wc -l |
                tr -d ' '
            )"
            if [[ "$JAVA_ENTRY_COUNT" != "1" ]]; then
              echo "Hot reload requires exactly one Java entry class in $APK."
              exit 1
            fi
          done

      - name: Verify Haple APK signatures
        if: steps.scope.outputs.full_build == 'true' && github.event_name != 'pull_request'
        shell: bash
        env:
          HAPLE_CERT_SHA256: 7a64fc85325afe79439afb63369d832d7ddc20fd5b3935b4c28d7bcb85e92fc7
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          for APK in "$DEBUG_APK_PATH" "$CANARY_APK_PATH"; do
            "$SDK_ROOT/build-tools/37.0.0/apksigner" verify               --verbose               --print-certs               "$APK"

            ACTUAL_CERT_SHA256="$(
              "$SDK_ROOT/build-tools/37.0.0/apksigner" verify                 --print-certs                 "$APK" |
                awk -F': ' '/certificate SHA-256 digest:/ { print $NF; exit }' |
                tr '[:upper:]' '[:lower:]'
            )"

            if [[ "$ACTUAL_CERT_SHA256" != "$HAPLE_CERT_SHA256" ]]; then
              echo "Built APK is not signed by the Haple certificate: $APK"
              exit 1
            fi
          done

      - name: Verify canary is non-debuggable
        if: steps.scope.outputs.full_build == 'true'
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          APKANALYZER="$(find "$SDK_ROOT/cmdline-tools" -type f -name apkanalyzer | sort -V | tail -n 1)"
          if [[ -z "$APKANALYZER" ]]; then
            echo "apkanalyzer was not found."
            exit 1
          fi

          if [[ "$("$APKANALYZER" manifest debuggable "$CANARY_APK_PATH")" != "false" ]]; then
            echo "Canary APK must be non-debuggable."
            exit 1
          fi

      - name: Prepare APKs
        if: steps.scope.outputs.full_build == 'true' && github.event_name != 'pull_request'
        shell: bash
        run: |
          VERSION_NAME="$(sed -n 's/^combinedStatus.versionName=//p' gradle.properties)"
          BUILD_ID="$(sed -n 's/^combinedStatus.buildId=//p' gradle.properties)"
          mkdir -p dist
          DEBUG_APK_NAME="CombinedStatus-${VERSION_NAME}-HyperOS-${BUILD_ID}-debug.apk"
          CANARY_APK_NAME="CombinedStatus-${VERSION_NAME}-HyperOS-${BUILD_ID}-canary.apk"
          cp "$DEBUG_APK_PATH" "dist/$DEBUG_APK_NAME"
          cp "$CANARY_APK_PATH" "dist/$CANARY_APK_NAME"
          echo "DEBUG_APK_NAME=$DEBUG_APK_NAME" >> "$GITHUB_ENV"
          echo "CANARY_APK_NAME=$CANARY_APK_NAME" >> "$GITHUB_ENV"

      - name: Upload debug APK
        if: steps.scope.outputs.full_build == 'true' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ env.DEBUG_APK_NAME }}
          path: dist/${{ env.DEBUG_APK_NAME }}
          if-no-files-found: error

      - name: Upload canary APK
        if: steps.scope.outputs.full_build == 'true' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ env.CANARY_APK_NAME }}
          path: dist/${{ env.CANARY_APK_NAME }}
          if-no-files-found: error
      - name: Validation summary
        if: always()
        shell: bash
        run: |
          echo "### Build validation" >> "$GITHUB_STEP_SUMMARY"
          echo "- Full Android build: `${{ steps.scope.outputs.full_build }}`" >> "$GITHUB_STEP_SUMMARY"
          if [[ "${{ github.event_name }}" == "pull_request" && "${{ github.event.pull_request.draft }}" == "true" ]]; then
            echo "- Pull request state: draft (lightweight validation only)" >> "$GITHUB_STEP_SUMMARY"
          fi

  promotion-readiness:
    needs: build
    if: always() && github.event_name == 'push' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/validation/dev')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      statuses: write

    steps:
      - name: Checkout current dev
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: dev
          fetch-depth: 0

      - name: Evaluate dev promotion readiness
        id: readiness
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git fetch origin main --no-tags
          git fetch origin validation/dev --no-tags || true

          DEV_SHA="$(git rev-parse HEAD)"
          MAIN_SHA="$(git rev-parse origin/main)"
          VALIDATED_SHA="$(git rev-parse origin/validation/dev 2>/dev/null || true)"
          AHEAD_BY="$(git rev-list --count origin/main..HEAD)"

          CI_OK=false
          SUCCESSFUL_DEV_RUN="$(
            gh api -X GET "repos/$GITHUB_REPOSITORY/actions/workflows/build.yml/runs" \
              -f branch=dev \
              -f event=push \
              -f status=success \
              -f per_page=20 \
              --jq ".workflow_runs[] | select(.head_sha == \"$DEV_SHA\") | .id" |
              head -n 1
          )"
          if [[ -n "$SUCCESSFUL_DEV_RUN" ]]; then
            CI_OK=true
          fi

          DEVICE_OK=false
          if [[ -n "$VALIDATED_SHA" && "$VALIDATED_SHA" == "$DEV_SHA" ]]; then
            DEVICE_OK=true
          fi

          CHANGELOG_OK=false
          if grep -Fq "## [Unreleased]" CHANGELOG.md; then
            CHANGELOG_OK=true
          fi

          READY=false
          STATE=pending
          DESCRIPTION="Promotion blocked: awaiting readiness gates"

          if [[ "$AHEAD_BY" -le 0 ]]; then
            DESCRIPTION="Promotion not needed: dev matches main"
          elif [[ "$CI_OK" != "true" ]]; then
            DESCRIPTION="Promotion blocked: dev Build is not green"
          elif [[ "$DEVICE_OK" != "true" ]]; then
            DESCRIPTION="Promotion blocked: dev device validation is stale or missing"
          elif [[ "$CHANGELOG_OK" != "true" ]]; then
            DESCRIPTION="Promotion blocked: Unreleased changelog section missing"
          else
            READY=true
            STATE=success
            DESCRIPTION="READY: dev is CI-green and device-validated"
          fi

          echo "dev_sha=$DEV_SHA" >> "$GITHUB_OUTPUT"
          echo "main_sha=$MAIN_SHA" >> "$GITHUB_OUTPUT"
          echo "validated_sha=$VALIDATED_SHA" >> "$GITHUB_OUTPUT"
          echo "ahead_by=$AHEAD_BY" >> "$GITHUB_OUTPUT"
          echo "ci_ok=$CI_OK" >> "$GITHUB_OUTPUT"
          echo "device_ok=$DEVICE_OK" >> "$GITHUB_OUTPUT"
          echo "changelog_ok=$CHANGELOG_OK" >> "$GITHUB_OUTPUT"
          echo "ready=$READY" >> "$GITHUB_OUTPUT"

          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$DEV_SHA" \
            -f state="$STATE" \
            -f context="promotion/readiness" \
            -f description="$DESCRIPTION"

      - name: Promotion readiness summary
        shell: bash
        run: |
          echo "### Promotion readiness" >> "$GITHUB_STEP_SUMMARY"
          echo "- dev: `${{ steps.readiness.outputs.dev_sha }}`" >> "$GITHUB_STEP_SUMMARY"
          echo "- ahead of main: `${{ steps.readiness.outputs.ahead_by }}` commit(s)" >> "$GITHUB_STEP_SUMMARY"
          echo "- dev Build green: `${{ steps.readiness.outputs.ci_ok }}`" >> "$GITHUB_STEP_SUMMARY"
          echo "- device validation current: `${{ steps.readiness.outputs.device_ok }}`" >> "$GITHUB_STEP_SUMMARY"
          echo "- changelog boundary present: `${{ steps.readiness.outputs.changelog_ok }}`" >> "$GITHUB_STEP_SUMMARY"
          echo "- READY: `${{ steps.readiness.outputs.ready }}`" >> "$GITHUB_STEP_SUMMARY"
