name: Build

on:
  push:
    branches: [ main, dev ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAPLE_KEYSTORE_PASSWORD: ${{ secrets.HAPLE_KEYSTORE_PASSWORD }}
      HAPLE_KEY_ALIAS: ${{ secrets.HAPLE_KEY_ALIAS }}
      HAPLE_CERT_SHA256: 7a64fc85325afe79439afb63369d832d7ddc20fd5b3935b4c28d7bcb85e92fc7

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android API 37
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --channel=3 "platforms;android-37.0" "build-tools;37.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.1'

      - name: Restore and verify Haple signing
        shell: bash
        env:
          HAPLE_KEYSTORE_BASE64: ${{ secrets.HAPLE_KEYSTORE_BASE64 }}
        run: bash tools/setup_haple_signing.sh

      - name: Verify pinned HyperOS target profile
        run: python3 tools/verify_target_profile.py

      - name: Build debug and release APKs
        run: gradle :app:assembleDebug :app:assembleRelease --stacktrace

      - name: Verify modern Xposed metadata
        shell: bash
        run: |
          REQUIRED_ENTRIES=(
            "META-INF/xposed/java_init.list"
            "META-INF/xposed/module.prop"
            "META-INF/xposed/scope.list"
          )

          for APK in             app/build/outputs/apk/debug/app-debug.apk             app/build/outputs/apk/release/app-release.apk; do
            for entry in "${REQUIRED_ENTRIES[@]}"; do
              if ! unzip -Z1 "$APK" | grep -Fxq "$entry"; then
                echo "Missing modern Xposed metadata in $APK: $entry"
                exit 1
              fi
            done

            if unzip -Z1 "$APK" | grep -Fxq "assets/xposed_init"; then
              echo "Legacy Xposed entry metadata must not be packaged in $APK."
              exit 1
            fi

            if [[ "$(unzip -p "$APK" META-INF/xposed/scope.list | tr -d '\r\n')" != "com.android.systemui" ]]; then
              echo "Unexpected Xposed scope in $APK."
              exit 1
            fi

            if ! unzip -p "$APK" META-INF/xposed/module.prop | grep -Fxq "targetApiVersion=102"; then
              echo "Modern Xposed target API 102 metadata is missing in $APK."
              exit 1
            fi

            if ! unzip -p "$APK" META-INF/xposed/module.prop | grep -Fxq "autoHotReload=true"; then
              echo "Modern Xposed hot reload metadata is missing in $APK."
              exit 1
            fi

            JAVA_ENTRY_COUNT="$(
              unzip -p "$APK" META-INF/xposed/java_init.list |
                tr -d '\r' |
                sed '/^[[:space:]]*$/d' |
                wc -l |
                tr -d ' '
            )"
            if [[ "$JAVA_ENTRY_COUNT" != "1" ]]; then
              echo "Hot reload requires exactly one Java entry class in $APK."
              exit 1
            fi
          done

      - name: Verify release diagnostics boundary
        shell: bash
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          TMP_DIR="$(mktemp -d)"
          trap 'rm -rf "$TMP_DIR"' EXIT
          unzip -qq "$APK" 'classes*.dex' -d "$TMP_DIR"

          if grep -aR -Fq "nativeStatus topology" "$TMP_DIR"; then
            echo "Release APK retained detailed native topology diagnostics."
            exit 1
          fi

          if grep -aR -Fq "networkPipeline hooks=ready" "$TMP_DIR"; then
            echo "Release APK retained debug-only network pipeline diagnostics."
            exit 1
          fi

      - name: Verify Haple APK signatures
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          APKSIGNER="$SDK_ROOT/build-tools/37.0.0/apksigner"

          for APK in             app/build/outputs/apk/debug/app-debug.apk             app/build/outputs/apk/release/app-release.apk; do
            "$APKSIGNER" verify --verbose --print-certs "$APK"

            ACTUAL_CERT_SHA256="$(
              "$APKSIGNER" verify --print-certs "$APK" |
                awk -F': ' '/certificate SHA-256 digest:/ { print $NF; exit }' |
                tr '[:upper:]' '[:lower:]'
            )"

            if [[ "$ACTUAL_CERT_SHA256" != "$HAPLE_CERT_SHA256" ]]; then
              echo "Built APK is not signed by the Haple certificate: $APK"
              exit 1
            fi
          done

      - name: Prepare comparison APKs
        shell: bash
        run: |
          VERSION_NAME="$(sed -n 's/^combinedStatus.versionName=//p' gradle.properties)"
          BUILD_ID="$(sed -n 's/^combinedStatus.buildId=//p' gradle.properties)"
          mkdir -p dist

          DEBUG_APK_NAME="CombinedStatus-${VERSION_NAME}-HyperOS-${BUILD_ID}-debug.apk"
          RELEASE_APK_NAME="CombinedStatus-${VERSION_NAME}-HyperOS-${BUILD_ID}-release.apk"

          cp app/build/outputs/apk/debug/app-debug.apk "dist/$DEBUG_APK_NAME"
          cp app/build/outputs/apk/release/app-release.apk "dist/$RELEASE_APK_NAME"

          echo "DEBUG_APK_NAME=$DEBUG_APK_NAME" >> "$GITHUB_ENV"
          echo "RELEASE_APK_NAME=$RELEASE_APK_NAME" >> "$GITHUB_ENV"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.DEBUG_APK_NAME }}
          path: dist/${{ env.DEBUG_APK_NAME }}
          if-no-files-found: error

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.RELEASE_APK_NAME }}
          path: dist/${{ env.RELEASE_APK_NAME }}
          if-no-files-found: error
