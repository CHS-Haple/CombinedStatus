name: Build

on:
  push:
    branches: [ main, dev ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAPLE_KEYSTORE_PASSWORD: ${{ secrets.HAPLE_KEYSTORE_PASSWORD }}
      HAPLE_KEY_ALIAS: ${{ secrets.HAPLE_KEY_ALIAS }}
      HAPLE_CERT_SHA256: 7a64fc85325afe79439afb63369d832d7ddc20fd5b3935b4c28d7bcb85e92fc7

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android API 37
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --channel=3 "platforms;android-37.0" "build-tools;37.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.1'

      - name: Restore and verify Haple signing
        shell: bash
        env:
          HAPLE_KEYSTORE_BASE64: ${{ secrets.HAPLE_KEYSTORE_BASE64 }}
        run: bash tools/setup_haple_signing.sh

      - name: Verify pinned HyperOS target profile
        run: python3 tools/verify_target_profile.py

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify modern Xposed metadata
        shell: bash
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          REQUIRED_ENTRIES=(
            "META-INF/xposed/java_init.list"
            "META-INF/xposed/module.prop"
            "META-INF/xposed/scope.list"
          )

          for entry in "${REQUIRED_ENTRIES[@]}"; do
            if ! unzip -Z1 "$APK" | grep -Fxq "$entry"; then
              echo "Missing modern Xposed metadata: $entry"
              exit 1
            fi
          done

          if unzip -Z1 "$APK" | grep -Fxq "assets/xposed_init"; then
            echo "Legacy Xposed entry metadata must not be packaged."
            exit 1
          fi

          if [[ "$(unzip -p "$APK" META-INF/xposed/scope.list | tr -d '\r\n')" != "com.android.systemui" ]]; then
            echo "Unexpected Xposed scope."
            exit 1
          fi

          if ! unzip -p "$APK" META-INF/xposed/module.prop | grep -Fxq "targetApiVersion=102"; then
            echo "Modern Xposed target API 102 metadata is missing."
            exit 1
          fi

          if ! unzip -p "$APK" META-INF/xposed/module.prop | grep -Fxq "autoHotReload=true"; then
            echo "Modern Xposed hot reload metadata is missing."
            exit 1
          fi

          JAVA_ENTRY_COUNT="$(
            unzip -p "$APK" META-INF/xposed/java_init.list |
              tr -d '\r' |
              sed '/^[[:space:]]*$/d' |
              wc -l |
              tr -d ' '
          )"
          if [[ "$JAVA_ENTRY_COUNT" != "1" ]]; then
            echo "Hot reload requires exactly one Java entry class."
            exit 1
          fi

      - name: Verify Haple debug APK signature
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          "$SDK_ROOT/build-tools/37.0.0/apksigner" verify \
            --verbose \
            --print-certs \
            app/build/outputs/apk/debug/app-debug.apk

          ACTUAL_CERT_SHA256="$(
            "$SDK_ROOT/build-tools/37.0.0/apksigner" verify \
              --print-certs \
              app/build/outputs/apk/debug/app-debug.apk |
              awk -F': ' '/certificate SHA-256 digest:/ { print $NF; exit }' |
              tr '[:upper:]' '[:lower:]'
          )"

          if [[ "$ACTUAL_CERT_SHA256" != "$HAPLE_CERT_SHA256" ]]; then
            echo "Built debug APK is not signed by the Haple certificate."
            exit 1
          fi

      - name: Prepare debug APK
        shell: bash
        run: |
          VERSION_NAME="$(sed -n 's/^combinedStatus.versionName=//p' gradle.properties)"
          BUILD_ID="$(sed -n 's/^combinedStatus.buildId=//p' gradle.properties)"
          mkdir -p dist
          APK_NAME="CombinedStatus-${VERSION_NAME}-HyperOS-${BUILD_ID}-ci${GITHUB_RUN_NUMBER}-debug.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "dist/$APK_NAME"
          echo "APK_NAME=$APK_NAME" >> "$GITHUB_ENV"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_NAME }}
          path: dist/${{ env.APK_NAME }}
          if-no-files-found: error
