name: Public Readiness Audit

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  history-secret-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout full history
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Fetch all repository refs
        shell: bash
        run: git fetch --all --tags --prune

      - name: Scan history for secret material
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t COMMITS < <(git rev-list --all)
          if [[ "${#COMMITS[@]}" -eq 0 ]]; then
            echo "No commits found."
            exit 1
          fi

          fail=0

          SECRET_FILES="$(
            git rev-list --objects --all |
              awk '{print $2}' |
              grep -Eai '\.(jks|keystore|p12|pfx|pem|key)$' |
              sort -u || true
          )"
          if [[ -n "$SECRET_FILES" ]]; then
            echo "::error::Secret-like file extensions are present in repository history:"
            printf '%s\n' "$SECRET_FILES"
            fail=1
          fi

          TOKEN_PATHS="$(
            git grep -Il -E               '-----BEGIN (RSA |EC |OPENSSH |DSA )?PRIVATE KEY-----|gh[pousr]_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|AKIA[0-9A-Z]{16}|AIza[0-9A-Za-z_-]{30,}|xox[baprs]-[A-Za-z0-9-]{20,}|HAPLE_KEYSTORE_BASE64[[:space:]]*[:=][[:space:]]*["'\'' ]?[A-Za-z0-9+/]{100,}'               "${COMMITS[@]}" 2>/dev/null |
              sort -u || true
          )"
          if [[ -n "$TOKEN_PATHS" ]]; then
            echo "::error::Secret-like content was found in repository history. Only commit/path references are shown:"
            printf '%s\n' "$TOKEN_PATHS"
            fail=1
          fi

          if [[ "$fail" -ne 0 ]]; then
            exit 1
          fi

          echo "History audit passed: no targeted secret material detected."
