name: Android build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android API 37
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --channel=3 "platforms;android-37.0" "build-tools;37.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.1'

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Prepare debug APK
        shell: bash
        run: |
          VERSION_NAME="$(sed -n 's/^combinedStatus.versionName=//p' gradle.properties)"
          BUILD_ID="$(sed -n 's/^combinedStatus.buildId=//p' gradle.properties)"
          mkdir -p dist
          APK_NAME="CombinedStatus-${VERSION_NAME}-HyperOS-${BUILD_ID}-ci${GITHUB_RUN_NUMBER}-debug.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "dist/$APK_NAME"
          echo "APK_NAME=$APK_NAME" >> "$GITHUB_ENV"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_NAME }}
          path: dist/${{ env.APK_NAME }}
          if-no-files-found: error
