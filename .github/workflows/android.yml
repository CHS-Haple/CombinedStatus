name: Android build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug:
    runs-on: ubuntu-latest
    env:
      CI_DEBUG_CERT_SHA256: d6a706dabd968ef74e416e7234fd13959c26e4e86d93ee4cd2f6778f1103ea2e

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android API 37
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --channel=3 "platforms;android-37.0" "build-tools;37.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.1'

      - name: Restore CI debug keystore
        shell: bash
        env:
          CI_DEBUG_KEYSTORE_BASE64: ${{ secrets.CI_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [[ -z "$CI_DEBUG_KEYSTORE_BASE64" ]]; then
            echo "CI_DEBUG_KEYSTORE_BASE64 is not configured."
            exit 1
          fi

          KEYSTORE_PATH="$RUNNER_TEMP/combinedstatus-ci-debug.keystore"
          printf '%s' "$CI_DEBUG_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"

          ACTUAL_CERT_SHA256="$(
            keytool -list -v               -keystore "$KEYSTORE_PATH"               -storepass android               -alias androiddebugkey 2>/dev/null             | sed -n 's/^.*SHA256: //p'             | head -n 1             | tr -d ':'             | tr '[:upper:]' '[:lower:]'
          )"

          if [[ "$ACTUAL_CERT_SHA256" != "$CI_DEBUG_CERT_SHA256" ]]; then
            echo "CI debug signing certificate does not match the expected certificate."
            exit 1
          fi

          echo "CI_DEBUG_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify debug APK signature
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          "$SDK_ROOT/build-tools/37.0.0/apksigner" verify             --verbose             --print-certs             app/build/outputs/apk/debug/app-debug.apk

          ACTUAL_CERT_SHA256="$(
            "$SDK_ROOT/build-tools/37.0.0/apksigner" verify               --print-certs               app/build/outputs/apk/debug/app-debug.apk             | awk -F': ' '/certificate SHA-256 digest:/ { print $NF; exit }'             | tr '[:upper:]' '[:lower:]'
          )"

          if [[ "$ACTUAL_CERT_SHA256" != "$CI_DEBUG_CERT_SHA256" ]]; then
            echo "Built APK is not signed by the fixed CI debug certificate."
            exit 1
          fi

      - name: Prepare debug APK
        shell: bash
        run: |
          VERSION_NAME="$(sed -n 's/^combinedStatus.versionName=//p' gradle.properties)"
          BUILD_ID="$(sed -n 's/^combinedStatus.buildId=//p' gradle.properties)"
          mkdir -p dist
          APK_NAME="CombinedStatus-${VERSION_NAME}-HyperOS-${BUILD_ID}-ci${GITHUB_RUN_NUMBER}-debug.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "dist/$APK_NAME"
          echo "APK_NAME=$APK_NAME" >> "$GITHUB_ENV"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_NAME }}
          path: dist/${{ env.APK_NAME }}
          if-no-files-found: error
