name: Work Branch Canary

on:
  workflow_run:
    workflows: [Build]
    types: [completed]
    branches:
      - 'feat/**'
      - 'fix/**'

permissions:
  actions: read
  contents: read
  packages: read

concurrency:
  group: work-canary-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

jobs:
  canary:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.actor.login == github.repository_owner &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MIUIX_GITHUB_ACTOR: ${{ github.repository_owner }}
      MIUIX_GITHUB_TOKEN: ${{ secrets.MIUIX_GITHUB_TOKEN }}
      GITHUB_ACTOR: ${{ github.actor }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout tested work-branch SHA
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android API 37
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --channel=3 "platforms;android-37.0" "build-tools;37.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3

      - name: Restore and verify Haple signing
        shell: bash
        env:
          HAPLE_KEYSTORE_BASE64: ${{ secrets.HAPLE_KEYSTORE_BASE64 }}
          HAPLE_KEYSTORE_PASSWORD: ${{ secrets.HAPLE_KEYSTORE_PASSWORD }}
          HAPLE_KEY_ALIAS: ${{ secrets.HAPLE_KEY_ALIAS }}
          HAPLE_CERT_SHA256: 7a64fc85325afe79439afb63369d832d7ddc20fd5b3935b4c28d7bcb85e92fc7
        run: bash tools/setup_haple_signing.sh

      - name: Verify pinned HyperOS target profile
        run: python3 tools/verify_target_profile.py

      - name: Test and build Canary
        env:
          HAPLE_KEYSTORE_PASSWORD: ${{ secrets.HAPLE_KEYSTORE_PASSWORD }}
          HAPLE_KEY_ALIAS: ${{ secrets.HAPLE_KEY_ALIAS }}
        run: ./gradlew :app:testDebugUnitTest :app:assembleCanary --stacktrace

      - name: Resolve Canary APK
        shell: bash
        run: |
          if [[ -f "app/build/outputs/apk/canary/app-canary.apk" ]]; then
            CANARY_APK_PATH="app/build/outputs/apk/canary/app-canary.apk"
          elif [[ -f "app/build/outputs/apk/canary/app-canary-unsigned.apk" ]]; then
            CANARY_APK_PATH="app/build/outputs/apk/canary/app-canary-unsigned.apk"
          else
            echo "Canary APK output was not found."
            exit 1
          fi
          echo "CANARY_APK_PATH=$CANARY_APK_PATH" >> "$GITHUB_ENV"

      - name: Verify modern Xposed metadata
        shell: bash
        run: |
          REQUIRED_ENTRIES=(
            "META-INF/xposed/java_init.list"
            "META-INF/xposed/module.prop"
            "META-INF/xposed/scope.list"
          )

          for entry in "${REQUIRED_ENTRIES[@]}"; do
            if ! unzip -Z1 "$CANARY_APK_PATH" | grep -Fxq "$entry"; then
              echo "Missing modern Xposed metadata: $entry"
              exit 1
            fi
          done

          if unzip -Z1 "$CANARY_APK_PATH" | grep -Fxq "assets/xposed_init"; then
            echo "Legacy Xposed entry metadata must not be packaged."
            exit 1
          fi

          if [[ "$(unzip -p "$CANARY_APK_PATH" META-INF/xposed/scope.list | tr -d '\r\n')" != "com.android.systemui" ]]; then
            echo "Unexpected Xposed scope."
            exit 1
          fi

          if ! unzip -p "$CANARY_APK_PATH" META-INF/xposed/module.prop | grep -Fxq "targetApiVersion=102"; then
            echo "Modern Xposed target API 102 metadata is missing."
            exit 1
          fi

          if ! unzip -p "$CANARY_APK_PATH" META-INF/xposed/module.prop | grep -Fxq "autoHotReload=true"; then
            echo "Modern Xposed hot reload metadata is missing."
            exit 1
          fi

          JAVA_ENTRY_COUNT="$(
            unzip -p "$CANARY_APK_PATH" META-INF/xposed/java_init.list |
              tr -d '\r' |
              sed '/^[[:space:]]*$/d' |
              wc -l |
              tr -d ' '
          )"
          if [[ "$JAVA_ENTRY_COUNT" != "1" ]]; then
            echo "Hot reload requires exactly one Java entry class."
            exit 1
          fi

      - name: Verify Haple APK signature
        shell: bash
        env:
          HAPLE_CERT_SHA256: 7a64fc85325afe79439afb63369d832d7ddc20fd5b3935b4c28d7bcb85e92fc7
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          "$SDK_ROOT/build-tools/37.0.0/apksigner" verify --verbose --print-certs "$CANARY_APK_PATH"

          ACTUAL_CERT_SHA256="$(
            "$SDK_ROOT/build-tools/37.0.0/apksigner" verify --print-certs "$CANARY_APK_PATH" |
              awk -F': ' '/certificate SHA-256 digest:/ { print $NF; exit }' |
              tr '[:upper:]' '[:lower:]'
          )"

          if [[ "$ACTUAL_CERT_SHA256" != "$HAPLE_CERT_SHA256" ]]; then
            echo "Built Canary is not signed by the Haple certificate."
            exit 1
          fi

      - name: Verify Canary is non-debuggable
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          APKANALYZER="$(find "$SDK_ROOT/cmdline-tools" -type f -name apkanalyzer | sort -V | tail -n 1)"
          if [[ -z "$APKANALYZER" ]]; then
            echo "apkanalyzer was not found."
            exit 1
          fi

          if [[ "$("$APKANALYZER" manifest debuggable "$CANARY_APK_PATH")" != "false" ]]; then
            echo "Canary APK must be non-debuggable."
            exit 1
          fi

      - name: Prepare Canary artifact
        shell: bash
        run: |
          VERSION_NAME="$(sed -n 's/^combinedStatus.versionName=//p' gradle.properties)"
          BUILD_ID="$(sed -n 's/^combinedStatus.buildId=//p' gradle.properties)"
          CANARY_APK_NAME="CombinedStatus-${VERSION_NAME}-HyperOS-${BUILD_ID}-canary.apk"
          mkdir -p dist
          cp "$CANARY_APK_PATH" "dist/$CANARY_APK_NAME"
          echo "CANARY_APK_NAME=$CANARY_APK_NAME" >> "$GITHUB_ENV"

      - name: Upload Canary APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ env.CANARY_APK_NAME }}
          path: dist/${{ env.CANARY_APK_NAME }}
          if-no-files-found: error

      - name: Validation summary
        if: always()
        shell: bash
        run: |
          echo "### Work-branch Canary" >> "$GITHUB_STEP_SUMMARY"
          echo "- Source branch: ${{ github.event.workflow_run.head_branch }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Source SHA: ${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Triggering Build: ${{ github.event.workflow_run.id }}" >> "$GITHUB_STEP_SUMMARY"
