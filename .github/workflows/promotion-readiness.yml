name: Promotion readiness

on:
  workflow_run:
    workflows: [ Build ]
    types: [ completed ]
    branches: [ dev, validation/dev ]

permissions:
  actions: read
  contents: read
  statuses: write

concurrency:
  group: promotion-readiness-dev
  cancel-in-progress: true

jobs:
  readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout current dev
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: dev
          fetch-depth: 0

      - name: Evaluate promotion readiness
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TRIGGER_BRANCH: ${{ github.event.workflow_run.head_branch }}
          TRIGGER_SHA: ${{ github.event.workflow_run.head_sha }}
          BUILD_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          git fetch origin main dev --no-tags
          git fetch origin validation/dev --no-tags || true

          DEV_SHA="$(git rev-parse origin/dev)"
          MAIN_SHA="$(git rev-parse origin/main)"
          VALIDATED_SHA="$(git rev-parse origin/validation/dev 2>/dev/null || true)"
          AHEAD_BY="$(git rev-list --count "origin/main..$DEV_SHA")"

          if [[ "$TRIGGER_BRANCH" == "dev" && "$TRIGGER_SHA" != "$DEV_SHA" ]]; then
            {
              printf '%s\n' "### Promotion readiness"
              printf '%s\n' "- ignored stale dev Build completion: $TRIGGER_SHA"
              printf '%s\n' "- current dev: $DEV_SHA"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if [[ "$TRIGGER_BRANCH" == "validation/dev" && -n "$VALIDATED_SHA" && "$TRIGGER_SHA" != "$VALIDATED_SHA" ]]; then
            {
              printf '%s\n' "### Promotion readiness"
              printf '%s\n' "- ignored stale validation marker completion: $TRIGGER_SHA"
              printf '%s\n' "- current validation/dev: $VALIDATED_SHA"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          CI_OK=false
          if [[ "$TRIGGER_BRANCH" == "dev" ]]; then
            if [[ "$BUILD_CONCLUSION" == "success" ]]; then
              CI_OK=true
            fi
          else
            SUCCESSFUL_DEV_RUN="$(
              gh api -X GET "repos/$GITHUB_REPOSITORY/actions/workflows/build.yml/runs" \
                -f branch=dev \
                -f event=push \
                -f status=success \
                -f per_page=20 \
                --jq ".workflow_runs[] | select(.head_sha == \"$DEV_SHA\") | .id" |
                head -n 1
            )"
            if [[ -n "$SUCCESSFUL_DEV_RUN" ]]; then
              CI_OK=true
            fi
          fi

          DEVICE_OK=false
          DEVICE_CARRIED=false

          if [[ -n "$VALIDATED_SHA" && "$VALIDATED_SHA" == "$DEV_SHA" ]]; then
            DEVICE_OK=true
          elif [[ -n "$VALIDATED_SHA" ]] && git merge-base --is-ancestor "$VALIDATED_SHA" "$DEV_SHA"; then
            DEVICE_IMPACT=false
            mapfile -t VALIDATION_DELTA < <(git diff --name-only "$VALIDATED_SHA" "$DEV_SHA")

            for path in "${VALIDATION_DELTA[@]}"; do
              case "$path" in
                gradle.properties)
                  NON_ROUTINE_PROPERTIES="$(
                    git diff --unified=0 "$VALIDATED_SHA" "$DEV_SHA" -- gradle.properties |
                      awk '/^[+-][^+-]/ {
                        line = substr($0, 2)
                        if (line !~ /^combinedStatus\.(versionCode|buildId)=/) {
                          print line
                        }
                      }'
                  )"
                  if [[ -n "$NON_ROUTINE_PROPERTIES" ]]; then
                    DEVICE_IMPACT=true
                    break
                  fi
                  ;;
                app/*|compat/*|gradle/*|tools/*|build.gradle.kts|settings.gradle.kts|gradlew|gradlew.bat)
                  DEVICE_IMPACT=true
                  break
                  ;;
              esac
            done

            if [[ "$DEVICE_IMPACT" == "false" ]]; then
              DEVICE_OK=true
              DEVICE_CARRIED=true
            fi
          fi

          CHANGELOG_OK=false
          if git show "$DEV_SHA:CHANGELOG.md" | grep -Fq "## [Unreleased]"; then
            CHANGELOG_OK=true
          fi

          READY=false
          STATE=pending
          DESCRIPTION="Promotion blocked: awaiting readiness gates"

          if [[ "$AHEAD_BY" -le 0 ]]; then
            DESCRIPTION="Promotion not needed: dev matches main"
          elif [[ "$CI_OK" != "true" ]]; then
            DESCRIPTION="Promotion blocked: dev Build is not green"
          elif [[ "$DEVICE_OK" != "true" ]]; then
            DESCRIPTION="Promotion blocked: dev device validation is stale or missing"
          elif [[ "$CHANGELOG_OK" != "true" ]]; then
            DESCRIPTION="Promotion blocked: Unreleased changelog section missing"
          else
            READY=true
            STATE=success
            DESCRIPTION="READY: dev is CI-green and device-validated"
          fi

          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$DEV_SHA" \
            -f state="$STATE" \
            -f context="promotion/readiness" \
            -f description="$DESCRIPTION"

          {
            printf '%s\n' "### Promotion readiness"
            printf '%s\n' "- trigger: $TRIGGER_BRANCH@$TRIGGER_SHA"
            printf '%s\n' "- dev: $DEV_SHA"
            printf '%s\n' "- main: $MAIN_SHA"
            printf '%s\n' "- validated: ${VALIDATED_SHA:-none}"
            printf '%s\n' "- ahead of main: $AHEAD_BY commit(s)"
            printf '%s\n' "- dev Build green: $CI_OK"
            printf '%s\n' "- device validation current: $DEVICE_OK"
            printf '%s\n' "- device validation carried across non-runtime delta: $DEVICE_CARRIED"
            printf '%s\n' "- changelog boundary present: $CHANGELOG_OK"
            printf '%s\n' "- READY: $READY"
          } >> "$GITHUB_STEP_SUMMARY"
