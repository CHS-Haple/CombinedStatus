name: Release build

on:
  workflow_dispatch:
    inputs:
      channel:
        description: Release channel
        required: true
        default: test
        type: choice
        options:
          - test
          - stable

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    environment: release
    env:
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.HAPLE_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.HAPLE_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.HAPLE_KEY_PASSWORD }}
      HAPLE_CERT_SHA256: 7a64fc85325afe79439afb63369d832d7ddc20fd5b3935b4c28d7bcb85e92fc7

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android API 37
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --channel=3 "platforms;android-37.0" "build-tools;37.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.1'

      - name: Validate signing secrets
        shell: bash
        env:
          HAPLE_KEYSTORE_BASE64: ${{ secrets.HAPLE_KEYSTORE_BASE64 }}
        run: |
          if [[ -z "$HAPLE_KEYSTORE_BASE64" || -z "$ANDROID_KEYSTORE_PASSWORD" || -z "$ANDROID_KEY_ALIAS" || -z "$ANDROID_KEY_PASSWORD" ]]; then
            echo "Haple release signing secrets are incomplete."
            exit 1
          fi

      - name: Restore and verify Haple keystore
        shell: bash
        env:
          HAPLE_KEYSTORE_BASE64: ${{ secrets.HAPLE_KEYSTORE_BASE64 }}
        run: |
          KEYSTORE_PATH="$RUNNER_TEMP/Haple.keystore"
          export KEYSTORE_PATH
          python3 - <<'PY'
          import base64
          import os
          import re
          from pathlib import Path

          raw = os.environ["HAPLE_KEYSTORE_BASE64"]
          candidates = re.findall(r"[A-Za-z0-9+/]+={0,2}", raw)
          encoded = max(candidates, key=len, default="")
          if not encoded:
              raise SystemExit("No Base64 payload found in HAPLE_KEYSTORE_BASE64")
          try:
              decoded = base64.b64decode(encoded, validate=True)
          except Exception as exc:
              raise SystemExit(f"Invalid Base64 payload: {exc}")
          Path(os.environ["KEYSTORE_PATH"]).write_bytes(decoded)
          print(f"Decoded keystore bytes: {len(decoded)}")
          PY
          chmod 600 "$KEYSTORE_PATH"

          ACTUAL_CERT_SHA256="$(
            keytool -list -v               -keystore "$KEYSTORE_PATH"               -storepass "$ANDROID_KEYSTORE_PASSWORD"               -alias "$ANDROID_KEY_ALIAS" 2>/dev/null |
              sed -n 's/^.*SHA256: //p' |
              head -n 1 |
              tr -d ':' |
              tr '[:upper:]' '[:lower:]'
          )"

          if [[ "$ACTUAL_CERT_SHA256" != "$HAPLE_CERT_SHA256" ]]; then
            echo "Haple keystore certificate does not match the expected SHA-256."
            echo "Expected: $HAPLE_CERT_SHA256"
            echo "Actual:   $ACTUAL_CERT_SHA256"
            exit 1
          fi

          echo "ANDROID_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"

      - name: Build signed release APK
        run: gradle :app:assembleRelease --stacktrace

      - name: Verify APK signature
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          APKSIGNER="$SDK_ROOT/build-tools/37.0.0/apksigner"
          APK="app/build/outputs/apk/release/app-release.apk"

          "$APKSIGNER" verify --verbose --print-certs "$APK"

          ACTUAL_CERT_SHA256="$(
            "$APKSIGNER" verify --print-certs "$APK" |
              awk -F': ' '/certificate SHA-256 digest:/ { print $NF; exit }' |
              tr '[:upper:]' '[:lower:]'
          )"

          if [[ "$ACTUAL_CERT_SHA256" != "$HAPLE_CERT_SHA256" ]]; then
            echo "Built APK is not signed by the Haple certificate."
            echo "Expected: $HAPLE_CERT_SHA256"
            echo "Actual:   $ACTUAL_CERT_SHA256"
            exit 1
          fi

      - name: Prepare release asset
        shell: bash
        run: |
          VERSION_NAME="$(sed -n 's/^combinedStatus.versionName=//p' gradle.properties)"
          BUILD_ID="$(sed -n 's/^combinedStatus.buildId=//p' gradle.properties)"
          mkdir -p dist
          APK_NAME="CombinedStatus-${VERSION_NAME}-HyperOS-${BUILD_ID}-ci${GITHUB_RUN_NUMBER}-release.apk"
          cp app/build/outputs/apk/release/app-release.apk "dist/$APK_NAME"

          if [[ "${{ inputs.channel }}" == "stable" ]]; then
            RELEASE_TAG="v$VERSION_NAME"
            RELEASE_TITLE="CombinedStatus $VERSION_NAME"
          else
            RELEASE_TAG="build-${BUILD_ID}-ci${GITHUB_RUN_NUMBER}"
            RELEASE_TITLE="CombinedStatus $VERSION_NAME ($BUILD_ID)"
          fi

          echo "APK_NAME=$APK_NAME" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"
          echo "RELEASE_TITLE=$RELEASE_TITLE" >> "$GITHUB_ENV"

      - name: Check stable tag
        if: inputs.channel == 'stable'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "A stable release already exists for $RELEASE_TAG. Increase versionName before publishing another stable release."
            exit 1
          fi

      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_NAME }}
          path: dist/${{ env.APK_NAME }}
          if-no-files-found: error

      - name: Publish test release
        if: inputs.channel == 'test'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" "dist/$APK_NAME"             --target "$GITHUB_SHA"             --title "$RELEASE_TITLE"             --notes "Signed HyperOS test build $RELEASE_TAG."             --prerelease

      - name: Publish stable release
        if: inputs.channel == 'stable'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" "dist/$APK_NAME"             --target "$GITHUB_SHA"             --title "$RELEASE_TITLE"             --notes "Signed CombinedStatus release $RELEASE_TAG."
