name: Release

on:
  workflow_dispatch:
    inputs:
      channel:
        description: Release channel
        required: true
        default: test
        type: choice
        options:
          - test
          - stable

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android API 37
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --channel=3 "platforms;android-37.0" "build-tools;37.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Restore and verify Haple signing
        shell: bash
        env:
          HAPLE_KEYSTORE_BASE64: ${{ secrets.HAPLE_KEYSTORE_BASE64 }}
          HAPLE_KEYSTORE_PASSWORD: ${{ secrets.HAPLE_KEYSTORE_PASSWORD }}
          HAPLE_KEY_ALIAS: ${{ secrets.HAPLE_KEY_ALIAS }}
          HAPLE_CERT_SHA256: 7a64fc85325afe79439afb63369d832d7ddc20fd5b3935b4c28d7bcb85e92fc7
        run: bash tools/setup_haple_signing.sh

      - name: Verify pinned HyperOS target profile
        run: python3 tools/verify_target_profile.py

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Build signed release APK
        env:
          HAPLE_KEYSTORE_PASSWORD: ${{ secrets.HAPLE_KEYSTORE_PASSWORD }}
          HAPLE_KEY_ALIAS: ${{ secrets.HAPLE_KEY_ALIAS }}
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Verify modern Xposed metadata
        shell: bash
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          REQUIRED_ENTRIES=(
            "META-INF/xposed/java_init.list"
            "META-INF/xposed/module.prop"
            "META-INF/xposed/scope.list"
          )

          for entry in "${REQUIRED_ENTRIES[@]}"; do
            if ! unzip -Z1 "$APK" | grep -Fxq "$entry"; then
              echo "Missing modern Xposed metadata in $APK: $entry"
              exit 1
            fi
          done

          if unzip -Z1 "$APK" | grep -Fxq "assets/xposed_init"; then
            echo "Legacy Xposed entry metadata must not be packaged in $APK."
            exit 1
          fi

          if [[ "$(unzip -p "$APK" META-INF/xposed/scope.list | tr -d '\r\n')" != "com.android.systemui" ]]; then
            echo "Unexpected Xposed scope in $APK."
            exit 1
          fi

          if ! unzip -p "$APK" META-INF/xposed/module.prop | grep -Fxq "targetApiVersion=102"; then
            echo "Modern Xposed target API 102 metadata is missing from $APK."
            exit 1
          fi

          if ! unzip -p "$APK" META-INF/xposed/module.prop | grep -Fxq "autoHotReload=true"; then
            echo "Modern Xposed hot reload metadata is missing from $APK."
            exit 1
          fi

          JAVA_ENTRY_COUNT="$(
            unzip -p "$APK" META-INF/xposed/java_init.list |
              tr -d '\r' |
              sed '/^[[:space:]]*$/d' |
              wc -l |
              tr -d ' '
          )"
          if [[ "$JAVA_ENTRY_COUNT" != "1" ]]; then
            echo "Hot reload requires exactly one Java entry class in $APK."
            exit 1
          fi

      - name: Verify release is non-debuggable
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          APKANALYZER="$(find "$SDK_ROOT/cmdline-tools" -type f -name apkanalyzer | sort -V | tail -n 1)"
          if [[ -z "$APKANALYZER" ]]; then
            echo "apkanalyzer was not found."
            exit 1
          fi

          if [[ "$("$APKANALYZER" manifest debuggable app/build/outputs/apk/release/app-release.apk)" != "false" ]]; then
            echo "Release APK must be non-debuggable."
            exit 1
          fi

      - name: Verify APK signature
        shell: bash
        env:
          HAPLE_CERT_SHA256: 7a64fc85325afe79439afb63369d832d7ddc20fd5b3935b4c28d7bcb85e92fc7
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          APKSIGNER="$SDK_ROOT/build-tools/37.0.0/apksigner"
          APK="app/build/outputs/apk/release/app-release.apk"

          "$APKSIGNER" verify --verbose --print-certs "$APK"

          ACTUAL_CERT_SHA256="$(
            "$APKSIGNER" verify --print-certs "$APK" |
              awk -F': ' '/certificate SHA-256 digest:/ { print $NF; exit }' |
              tr '[:upper:]' '[:lower:]'
          )"

          if [[ "$ACTUAL_CERT_SHA256" != "$HAPLE_CERT_SHA256" ]]; then
            echo "Built APK is not signed by the Haple certificate."
            echo "Expected: $HAPLE_CERT_SHA256"
            echo "Actual:   $ACTUAL_CERT_SHA256"
            exit 1
          fi

      - name: Prepare release asset
        shell: bash
        run: |
          VERSION_NAME="$(sed -n 's/^combinedStatus.versionName=//p' gradle.properties)"
          BUILD_ID="$(sed -n 's/^combinedStatus.buildId=//p' gradle.properties)"
          mkdir -p dist
          APK_NAME="CombinedStatus-${VERSION_NAME}-HyperOS-${BUILD_ID}-release.apk"
          cp app/build/outputs/apk/release/app-release.apk "dist/$APK_NAME"

          if [[ "${{ inputs.channel }}" == "stable" ]]; then
            RELEASE_TAG="v$VERSION_NAME"
            RELEASE_TITLE="CombinedStatus $VERSION_NAME"
          else
            RELEASE_TAG="build-${BUILD_ID}-ci${GITHUB_RUN_NUMBER}"
            RELEASE_TITLE="CombinedStatus $VERSION_NAME ($BUILD_ID)"
          fi

          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "BUILD_ID=$BUILD_ID" >> "$GITHUB_ENV"
          echo "APK_NAME=$APK_NAME" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"
          echo "RELEASE_TITLE=$RELEASE_TITLE" >> "$GITHUB_ENV"

      - name: Validate stable release boundary
        if: inputs.channel == 'stable'
        shell: bash
        run: |
          if [[ "$GITHUB_REF_NAME" != "main" ]]; then
            echo "Stable releases must be published from main, not $GITHUB_REF_NAME."
            exit 1
          fi

          python3 - <<'PY'
          import os
          import pathlib
          import re

          version = os.environ["VERSION_NAME"]
          changelog = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8")
          heading = re.compile(
              rf"^## \\[{re.escape(version)}\\] - \\d{{4}}-\\d{{2}}-\\d{{2}}$",
              re.MULTILINE,
          )
          match = heading.search(changelog)
          if match is None:
              raise SystemExit(
                  f"CHANGELOG.md must contain a dated ## [{version}] release section before publishing stable."
              )

          body_start = match.end()
          next_heading = re.search(r"^## \\[", changelog[body_start:], re.MULTILINE)
          body_end = body_start + next_heading.start() if next_heading else len(changelog)
          notes = changelog[body_start:body_end].strip()
          if not notes:
              raise SystemExit(f"The CHANGELOG release section for {version} has no release notes.")

          pathlib.Path("release-notes.md").write_text(notes + "\\n", encoding="utf-8")
          PY

      - name: Check stable tag
        if: inputs.channel == 'stable'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "A stable release already exists for $RELEASE_TAG. Increase versionName before publishing another stable release."
            exit 1
          fi

      - name: Upload signed APK artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ env.APK_NAME }}
          path: dist/${{ env.APK_NAME }}
          if-no-files-found: error

      - name: Publish test release
        if: inputs.channel == 'test'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" "dist/$APK_NAME" \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_TITLE" \
            --notes "Signed HyperOS test build $RELEASE_TAG." \
            --prerelease

      - name: Publish stable release
        if: inputs.channel == 'stable'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" "dist/$APK_NAME" \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_TITLE" \
            --notes-file release-notes.md
